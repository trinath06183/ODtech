<!-- ═════════════════════════════════════════════════════════════════
     E-Way Bill Upload & Verification Modal
     Auto-links to Invoice/Challan and syncs to EDMS & Document Trail
     ═════════════════════════════════════════════════════════════════ -->
<div id="ewayUploadModal"
     class="fixed inset-0 z-[300] hidden items-center justify-center p-4"
     style="background: rgba(15, 23, 42, 0.72); backdrop-filter: blur(8px);">

    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg border border-slate-100 overflow-hidden flex flex-col"
         style="max-height: 90vh; animation: ewayModalPop 0.22s cubic-bezier(.34,1.56,.64,1);">

        <!-- Modal Header -->
        <div class="flex items-center justify-between px-6 pt-5 pb-4 border-b border-slate-100 shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-amber-500/10 text-amber-600 flex items-center justify-center font-bold text-xl border border-amber-500/20 shrink-0">
                    🚚
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h3 class="text-base font-bold text-slate-900">E-Way Bill Verification</h3>
                        <span id="ewayDocBadge" class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800 border border-amber-200">
                            Invoice
                        </span>
                    </div>
                    <p class="text-xs text-slate-500 mt-0.5">Required before downloading document</p>
                </div>
            </div>
            <button type="button" onclick="closeEWayUploadModal()"
                    class="p-2 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-xl transition-colors cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Scrollable Modal Body -->
        <div class="overflow-y-auto flex-1 px-6 py-5 space-y-4">

            <!-- Compliance Notice -->
            <div class="p-3.5 rounded-2xl bg-amber-50 border border-amber-200/80 text-amber-900 text-xs leading-relaxed flex items-start gap-2.5">
                <svg class="w-4 h-4 text-amber-600 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <div>
                    <span class="font-bold">E-Way Bill check:</span>
                    Please upload the E-Way Bill for <strong id="ewayDocNumber" class="font-mono text-slate-800"></strong>. It will be stored in EDMS and automatically linked in the document trail.
                </div>
            </div>

            <!-- Error Banner -->
            <div id="ewayModalError" class="hidden p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-xs"></div>

            <!-- Drag & Drop Upload Zone -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Upload E-Way Bill File <span class="text-rose-500">*</span>
                </label>
                <div id="ewayDropZone"
                     class="relative border-2 border-dashed border-slate-300 hover:border-amber-500 bg-slate-50 hover:bg-amber-50/20 rounded-2xl p-6 text-center cursor-pointer transition-all group">
                    <input type="file" id="ewayFileInput" accept=".pdf,.png,.jpg,.jpeg,.webp" class="hidden">
                    <div id="dropZonePrompt" class="space-y-1.5">
                        <div class="w-10 h-10 rounded-full bg-slate-200/70 group-hover:bg-amber-100 flex items-center justify-center mx-auto text-slate-500 group-hover:text-amber-600 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                            </svg>
                        </div>
                        <p class="text-xs font-bold text-slate-700 group-hover:text-amber-700">
                            Click or drag &amp; drop E-Way Bill here
                        </p>
                        <p class="text-[11px] text-slate-400">PDF, JPG, PNG or WEBP (up to 15 MB)</p>
                    </div>

                    <!-- File Selected Preview Card -->
                    <div id="dropZoneSelected" class="hidden flex items-center justify-between p-2.5 bg-white rounded-xl border border-amber-300 shadow-sm text-left">
                        <div class="flex items-center gap-2.5 min-w-0">
                            <div class="w-8 h-8 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center font-bold text-xs shrink-0">
                                📄
                            </div>
                            <div class="min-w-0">
                                <p id="selectedFileName" class="text-xs font-bold text-slate-800 truncate"></p>
                                <p id="selectedFileSize" class="text-[10px] text-slate-400 font-mono"></p>
                            </div>
                        </div>
                        <button type="button" onclick="clearSelectedEWayFile(event)"
                                class="p-1 text-slate-400 hover:text-rose-600 rounded-lg transition-colors cursor-pointer" title="Remove file">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Optional Details Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">
                        E-Way Bill No. <span class="text-slate-400 font-normal">(Optional)</span>
                    </label>
                    <input type="text" id="ewayNumberInput" maxlength="50" placeholder="e.g. 1210 2345 6789"
                           class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 text-xs text-slate-800 font-mono transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">
                        E-Way Bill Date <span class="text-slate-400 font-normal">(Optional)</span>
                    </label>
                    <input type="date" id="ewayDateInput"
                           class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 text-xs text-slate-800 transition">
                </div>
            </div>

        </div>

        <!-- Modal Footer Actions -->
        <div class="px-6 py-4 bg-slate-50/80 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3 shrink-0">
            <!-- Left: Skip Button -->
            <button type="button" id="btnSkipEWay" onclick="submitEWayNotRequired()"
                    class="px-3.5 py-2.5 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-200/80 text-xs font-bold border border-slate-200 bg-white transition shadow-2xs inline-flex items-center gap-1.5 cursor-pointer">
                <span>⏭️ E-Way Bill Not Required</span>
            </button>

            <!-- Right: Cancel + Upload & Download -->
            <div class="flex items-center gap-2 ml-auto">
                <button type="button" onclick="closeEWayUploadModal()"
                        class="px-3.5 py-2.5 rounded-xl text-slate-500 hover:text-slate-700 text-xs font-semibold transition cursor-pointer">
                    Cancel
                </button>
                <button type="button" id="btnUploadEWay" onclick="submitEWayUpload()"
                        class="px-4 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold shadow-sm shadow-amber-600/30 transition inline-flex items-center gap-2 cursor-pointer">
                    <svg id="uploadSpinner" class="w-3.5 h-3.5 animate-spin hidden" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                    </svg>
                    <span id="uploadBtnText">📤 Upload &amp; Download</span>
                </button>
            </div>
        </div>

    </div>
</div>

<style>
@keyframes ewayModalPop {
    from { opacity: 0; transform: scale(0.94) translateY(12px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
}
</style>

<script>
(function() {
    window.satisfiedDocs = window.satisfiedDocs || new Set();

    let currentDocId = null;
    let currentDownloadUrl = null;
    let selectedFile = null;

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    function getCsrf() {
        return getCookie('csrftoken') || (document.querySelector('[name=csrfmiddlewaretoken]') ? document.querySelector('[name=csrfmiddlewaretoken]').value : '');
    }

    // Trigger check before download
    window.triggerEWayBillCheck = function(docId, docNumber, docType, downloadUrl) {
        // If already satisfied in session, download immediately!
        if (window.satisfiedDocs.has(docId)) {
            triggerFileDownload(downloadUrl);
            return;
        }

        currentDocId = docId;
        currentDownloadUrl = downloadUrl;
        selectedFile = null;

        // Populate modal fields
        document.getElementById('ewayDocBadge').textContent = docType || 'Invoice';
        document.getElementById('ewayDocNumber').textContent = (docType || 'Document') + ' #' + docNumber;
        document.getElementById('ewayNumberInput').value = '';
        document.getElementById('ewayDateInput').value = '';
        clearSelectedEWayFile();
        showError('');

        const modal = document.getElementById('ewayUploadModal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
    };

    window.closeEWayUploadModal = function() {
        const modal = document.getElementById('ewayUploadModal');
        if (modal) {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
        currentDocId = null;
        currentDownloadUrl = null;
        selectedFile = null;
    };

    function triggerFileDownload(url) {
        if (!url) return;
        // Direct download using an anchor element
        const a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function showError(msg) {
        const errEl = document.getElementById('ewayModalError');
        if (!errEl) return;
        if (msg) {
            errEl.textContent = msg;
            errEl.classList.remove('hidden');
        } else {
            errEl.classList.add('hidden');
            errEl.textContent = '';
        }
    }

    // File selection & drop handlers
    const dropZone = document.getElementById('ewayDropZone');
    const fileInput = document.getElementById('ewayFileInput');

    if (dropZone && fileInput) {
        dropZone.addEventListener('click', function(e) {
            if (e.target.closest('button')) return;
            fileInput.click();
        });

        fileInput.addEventListener('change', function() {
            if (fileInput.files && fileInput.files[0]) {
                handleFile(fileInput.files[0]);
            }
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, function(e) {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('border-amber-500', 'bg-amber-50/40');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, function(e) {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('border-amber-500', 'bg-amber-50/40');
            });
        });

        dropZone.addEventListener('drop', function(e) {
            if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
                handleFile(e.dataTransfer.files[0]);
            }
        });
    }

    function handleFile(file) {
        if (!file) return;
        const maxBytes = 15 * 1024 * 1024;
        if (file.size > maxBytes) {
            showError("Selected file is too large. Maximum size is 15 MB.");
            return;
        }
        showError('');
        selectedFile = file;
        document.getElementById('dropZonePrompt').classList.add('hidden');
        document.getElementById('dropZoneSelected').classList.remove('hidden');
        document.getElementById('selectedFileName').textContent = file.name;

        const sizeStr = file.size > 1024 * 1024
            ? (file.size / (1024 * 1024)).toFixed(2) + ' MB'
            : (file.size / 1024).toFixed(1) + ' KB';
        document.getElementById('selectedFileSize').textContent = sizeStr;
    }

    window.clearSelectedEWayFile = function(e) {
        if (e) e.stopPropagation();
        selectedFile = null;
        if (fileInput) fileInput.value = '';
        const prompt = document.getElementById('dropZonePrompt');
        const selected = document.getElementById('dropZoneSelected');
        if (prompt) prompt.classList.remove('hidden');
        if (selected) selected.classList.add('hidden');
    };

    // Submit Upload
    window.submitEWayUpload = async function() {
        if (!currentDocId) return;

        const ewayNumber = (document.getElementById('ewayNumberInput').value || '').trim();
        const ewayDate = (document.getElementById('ewayDateInput').value || '').trim();

        if (!selectedFile && !ewayNumber) {
            showError("Please upload an E-Way Bill file or enter the E-Way Bill number.");
            return;
        }

        const btn = document.getElementById('btnUploadEWay');
        const spinner = document.getElementById('uploadSpinner');
        const btnText = document.getElementById('uploadBtnText');

        btn.disabled = true;
        spinner.classList.remove('hidden');
        btnText.textContent = "Uploading & Linking...";
        showError('');

        try {
            const formData = new FormData();
            if (selectedFile) {
                formData.append('eway_bill_file', selectedFile);
            }
            if (ewayNumber) {
                formData.append('eway_bill', ewayNumber);
            }
            if (ewayDate) {
                formData.append('eway_bill_date', ewayDate);
            }

            const response = await fetch(`/documents/api/${currentDocId}/upload-eway-bill/`, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCsrf(),
                },
                body: formData,
            });

            const data = await response.json();
            if (data.success) {
                window.satisfiedDocs.add(currentDocId);
                const targetUrl = data.download_url || currentDownloadUrl;
                closeEWayUploadModal();
                triggerFileDownload(targetUrl);

                // If preview page or list row, reload or update UI after slight delay
                if (window.location.pathname.includes('/preview/')) {
                    setTimeout(() => window.location.reload(), 1500);
                }
            } else {
                showError(data.error || "Failed to upload E-Way Bill.");
            }
        } catch (err) {
            showError("Network error: " + err.message);
        } finally {
            btn.disabled = false;
            spinner.classList.add('hidden');
            btnText.textContent = "📤 Upload & Download";
        }
    };

    // Submit Not Required
    window.submitEWayNotRequired = async function() {
        if (!currentDocId) return;

        const btn = document.getElementById('btnSkipEWay');
        const origText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = `<span>Processing...</span>`;
        showError('');

        try {
            const response = await fetch(`/documents/api/${currentDocId}/skip-eway-bill/`, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCsrf(),
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({}),
            });

            const data = await response.json();
            if (data.success) {
                window.satisfiedDocs.add(currentDocId);
                const targetUrl = data.download_url || currentDownloadUrl;
                closeEWayUploadModal();
                triggerFileDownload(targetUrl);

                if (window.location.pathname.includes('/preview/')) {
                    setTimeout(() => window.location.reload(), 1500);
                }
            } else {
                showError(data.error || "Failed to skip E-Way Bill.");
            }
        } catch (err) {
            showError("Network error: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = origText;
        }
    };

    // Close on backdrop or Escape key
    document.getElementById('ewayUploadModal').addEventListener('click', function(e) {
        if (e.target === this) closeEWayUploadModal();
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeEWayUploadModal();
    });
})();
</script>
