<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - System Error | ODtech ERP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 1rem; max-width: 32rem; width: 100%; padding: 2rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); text-align: center; }
        .badge { display: inline-block; padding: 0.35rem 0.75rem; background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.4); border-radius: 9999px; font-weight: 700; font-size: 0.85rem; margin-bottom: 1rem; }
        h1 { font-size: 1.75rem; color: #f8fafc; margin-bottom: 0.75rem; font-weight: 700; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem; }
        .btn { display: inline-block; padding: 0.75rem 1.5rem; background: #6366f1; color: #ffffff; border-radius: 0.5rem; font-weight: 600; text-decoration: none; transition: background 0.2s; }
        .btn:hover { background: #4f46e5; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">500 Server Error</div>
        <h1>Internal Server Error</h1>
        <p>An unexpected error occurred while processing your request. If you are an administrator, please inspect the system logs on the server.</p>
        <a href="/" class="btn">Return to Dashboard</a>
    </div>
</body>
</html>
