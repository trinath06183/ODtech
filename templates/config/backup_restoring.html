{% extends 'base.html' %}

{% block header %}Restoring System...{% endblock %}

{% block content %}
<div class="max-w-md mx-auto text-center mt-20">
    <div class="bg-white rounded-2xl p-10 shadow-sm border border-slate-200">
        
        <!-- Spinner -->
        <div class="relative w-20 h-20 mx-auto mb-6">
            <svg class="animate-spin text-red-500 w-full h-full" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <div class="absolute inset-0 flex items-center justify-center">
                <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            </div>
        </div>

        <h2 class="text-2xl font-bold text-slate-800 mb-2">Restoring Data...</h2>
        <p class="text-slate-500 mb-6">
            Please wait while the database and media files are overwritten. This usually takes about 10 seconds.
        </p>
        
        <div class="w-full bg-slate-100 rounded-full h-2 mb-6 overflow-hidden">
            <div class="bg-red-500 h-2 rounded-full animate-pulse" style="width: 100%"></div>
        </div>

        <p class="text-sm text-slate-400">
            You will be automatically redirected to the dashboard shortly.
        </p>

    </div>
</div>

<script>
    // Redirect to home page after 15 seconds (giving restore time to finish)
    setTimeout(function() {
        window.location.href = "/";
    }, 15000);
</script>
{% endblock %}
