{% load static %}
<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete — ODtech ERP</title>
    <link href="{% static 'vendor/css/fonts.css' %}" rel="stylesheet">
    <script src="{% static 'vendor/js/tailwindcss.js' %}"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { background: linear-gradient(135deg, #F0FDF4 0%, #D1FAE5 100%); background-attachment: fixed; }
        .glass { background: rgba(255, 255, 255, 0.82); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(52, 211, 153, 0.25); }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
        .blob { animation: float 6s ease-in-out infinite; }
        .blob2 { animation: float 8s ease-in-out infinite reverse; }

        @keyframes checkPop {
            0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
            70%  { transform: scale(1.15) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .check-animate { animation: checkPop 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards; }

        @keyframes countdownAnim { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 125.6; } }
        .countdown-ring { animation: countdownAnim 5s linear forwards; }

        .text-dark { color: #0F172A; }
        .text-muted { color: #475569; }
        .text-success { color: #059669; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans antialiased relative overflow-hidden">

    <!-- Decorative blobs -->
    <div class="blob absolute top-[-8%] left-[-5%] w-96 h-96 bg-emerald-600/12 rounded-full blur-[80px] pointer-events-none"></div>
    <div class="blob2 absolute bottom-[-8%] right-[-5%] w-96 h-96 bg-teal-600/12 rounded-full blur-[80px] pointer-events-none"></div>

    <div class="w-full max-w-md px-4">
        <!-- Logo -->
        <div class="text-center mb-10">
            <a href="/">
                <img src="{% static 'img/logo.png' %}" alt="ODtech Logo" class="h-16 mx-auto mb-4 drop-shadow-lg">
            </a>
        </div>

        <!-- Card -->
        <div class="glass rounded-3xl p-10 shadow-2xl text-center">

            <!-- Animated check icon -->
            <div class="w-20 h-20 rounded-full bg-emerald-100 border-4 border-emerald-400 flex items-center justify-center mx-auto mb-6 check-animate">
                <svg class="w-10 h-10 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                </svg>
            </div>

            <h2 class="text-2xl font-bold text-dark mb-2">Password Reset!</h2>
            <p class="text-muted text-sm leading-relaxed mb-8">
                Your password has been reset successfully.<br>
                A security alert has been sent to your email.<br>
                You can now sign in with your new password.
            </p>

            <!-- Auto-redirect countdown -->
            <div class="flex items-center justify-center gap-3 mb-6">
                <svg class="w-10 h-10 -rotate-90" viewBox="0 0 40 40">
                    <circle cx="20" cy="20" r="17" fill="none" stroke="#d1fae5" stroke-width="4"/>
                    <circle id="cdRing" class="countdown-ring" cx="20" cy="20" r="17" fill="none"
                            stroke="#10b981" stroke-width="4"
                            stroke-dasharray="106.8" stroke-dashoffset="0"
                            stroke-linecap="round"/>
                </svg>
                <p class="text-sm text-muted">
                    Redirecting to login in <strong id="cdNum">5</strong>s…
                </p>
            </div>

            <a href="{% url 'login' %}"
               class="inline-block w-full py-3 px-6 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-semibold rounded-xl transition-all duration-200 shadow-lg shadow-emerald-500/25 hover:-translate-y-0.5 text-base">
                Sign In Now
            </a>
        </div>

        <p class="text-center text-slate-500 text-xs mt-6">
            ODtech ERP &copy; 2026 &mdash; All rights reserved
        </p>
    </div>

    <script>
        let secs = 5;
        const cdNum = document.getElementById('cdNum');
        const interval = setInterval(() => {
            secs--;
            cdNum.textContent = secs;
            if (secs <= 0) {
                clearInterval(interval);
                window.location.href = "{% url 'login' %}";
            }
        }, 1000);
    </script>
</body>
</html>
