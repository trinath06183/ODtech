{% load static %}
<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — ODtech Enterprise</title>
    <link rel="icon" type="image/png" href="{% static 'img/logo.png' %}">
    <link href="{% static 'vendor/css/fonts.css' %}" rel="stylesheet">
    <script src="{% static 'vendor/js/tailwindcss.js' %}"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'Inter', 'sans-serif'] },
                    colors: {
                        primary: {
                            DEFAULT: '#4664EB',
                            hover: '#3654D8',
                            light: '#EAF0FF',
                        },
                        navy: '#111827',
                        body: '#697386',
                        muted: '#8A95A6',
                        fine: '#DDE3EC',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --primary: #4664EB;
            --primary-hover: #3654D8;
            --primary-light: #EAF0FF;
            --navy: #111827;
            --text-body: #697386;
            --border-fine: #DDE3EC;
        }

        body {
            background-color: #FFFFFF;
            background-image: radial-gradient(#DDE3EC 1px, transparent 1px);
            background-size: 28px 28px;
            background-attachment: fixed;
            color: #111827;
        }

        .card-cloud {
            background: #ffffff;
            border: 1px solid #DDE3EC;
            box-shadow: 0 4px 20px -2px rgba(17, 24, 39, 0.05), 0 2px 6px -1px rgba(17, 24, 39, 0.03);
            border-radius: 1.25rem;
        }

        .input-cloud {
            background: #FAFBFF;
            border: 1px solid #DDE3EC;
            color: #111827;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            width: 100%;
            font-size: 0.95rem;
            transition: all 0.18s ease;
            outline: none;
        }
        .input-cloud:focus {
            background: #ffffff;
            border-color: #4664EB;
            box-shadow: 0 0 0 3.5px #EAF0FF;
        }
        .input-cloud::placeholder {
            color: #8A95A6;
        }

        .btn-primary-cloud {
            background-color: #4664EB;
            color: #ffffff;
            font-weight: 700;
            border-radius: 0.75rem;
            transition: all 0.18s ease;
            box-shadow: 0 2px 6px rgba(70, 100, 235, 0.25);
        }
        .btn-primary-cloud:hover {
            background-color: #3654D8;
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(70, 100, 235, 0.32);
        }
        .btn-primary-cloud:active {
            transform: translateY(0);
        }
        .btn-primary-cloud:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px #EAF0FF, 0 0 0 5px #4664EB;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans antialiased relative p-4">

    <!-- Centered Login Box -->
    <div class="w-full max-w-md">
        
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <a href="/" class="inline-block transition-transform hover:scale-105 duration-200">
                <img src="{% static 'img/logo.png' %}" alt="ODtech Logo" class="h-16 mx-auto mb-4 object-contain">
            </a>
            <h1 class="text-2xl sm:text-3xl font-black text-[#111827] tracking-tight">Welcome Back</h1>
            <p class="text-sm text-[#697386] mt-1 font-medium">Sign in to ODtech Enterprise Unified Portal</p>
        </div>

        <!-- White Cloud Card -->
        <div class="card-cloud p-8 sm:p-9 relative">
            
            <!-- Flash Messages -->
            {% if messages %}
            {% for msg in messages %}
            <div class="mb-5 p-3 rounded-xl text-xs font-bold text-center {% if msg.tags == 'error' %}bg-rose-50 text-rose-600 border border-rose-200{% else %}bg-[#ECF9F1] text-[#2DA866] border border-[#2DA866]/30{% endif %}">
                {{ msg }}
            </div>
            {% endfor %}
            {% endif %}

            <form method="post" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}" autocomplete="off" class="space-y-5">
                {% csrf_token %}

                <!-- Employee Code -->
                <div>
                    <label for="id_username" class="block text-xs font-bold uppercase tracking-wider text-[#111827] mb-2">
                        Employee Code / Username
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-[#8A95A6] pointer-events-none">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        </span>
                        <input type="text" id="id_username" name="username" placeholder="e.g. OD0124"
                               class="input-cloud pl-11" required autofocus>
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="id_password" class="block text-xs font-bold uppercase tracking-wider text-[#111827]">
                            Password
                        </label>
                        <a href="{% url 'password_reset' %}" class="text-xs font-bold text-[#4664EB] hover:text-[#3654D8] transition-colors">
                            Forgot Password?
                        </a>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-[#8A95A6] pointer-events-none">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        </span>
                        <input type="password" id="id_password" name="password" placeholder="Enter your password"
                               class="input-cloud pl-11 pr-11" required>
                        <button type="button" id="toggle_password" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-[#8A95A6] hover:text-[#111827] transition-colors focus:outline-none" aria-label="Toggle password visibility">
                            <!-- eye icon -->
                            <svg id="eye_open" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <!-- eye off icon -->
                            <svg id="eye_closed" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit"
                            class="btn-primary-cloud w-full py-3.5 px-6 text-sm flex items-center justify-center gap-2">
                        <span>Sign In</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                        </svg>
                    </button>
                </div>
            </form>

        </div>

    </div>

    <!-- Script to toggle password field visibility -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('id_password');
            const toggleBtn = document.getElementById('toggle_password');
            const eyeOpen = document.getElementById('eye_open');
            const eyeClosed = document.getElementById('eye_closed');

            if (toggleBtn && passwordInput) {
                toggleBtn.addEventListener('click', function() {
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        eyeOpen.classList.remove('hidden');
                        eyeClosed.classList.add('hidden');
                    } else {
                        passwordInput.type = 'password';
                        eyeOpen.classList.add('hidden');
                        eyeClosed.classList.remove('hidden');
                    }
                });
            }
        });
    </script>
</body>
</html>
