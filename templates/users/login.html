{% load static %}
<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — ODtech ERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { background: linear-gradient(135deg, #F0F9FF 0%, #E0F2FE 100%); background-attachment: fixed; }
        .glass { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(56, 189, 248, 0.18); }
        .input-field {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: #0f172a;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            width: 100%;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        .input-field:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,0.15); }
        .input-field::placeholder { color: rgba(71, 85, 105, 0.6); }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
        .blob { animation: float 6s ease-in-out infinite; }
        .blob2 { animation: float 8s ease-in-out infinite reverse; }

        /* Premium Light Theme overrides */
        .text-white { color: #0F172A !important; }
        .text-gray-300 { color: #334155 !important; }
        .text-gray-400 { color: #475569 !important; }
        .text-gray-500 { color: #475569 !important; }
        .text-gray-600 { color: #64748B !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans antialiased relative overflow-hidden">

    <!-- Decorative blobs -->
    <div class="blob absolute top-[-8%] left-[-5%] w-96 h-96 bg-blue-600/15 rounded-full blur-[80px] pointer-events-none"></div>
    <div class="blob2 absolute bottom-[-8%] right-[-5%] w-96 h-96 bg-purple-600/15 rounded-full blur-[80px] pointer-events-none"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-indigo-600/5 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="w-full max-w-md px-4">
        <!-- Logo + Brand -->
        <div class="text-center mb-10">
            <a href="/">
                <img src="{% static 'img/logo.png' %}" alt="ODtech Logo" class="h-16 mx-auto mb-4 drop-shadow-lg">
            </a>
            <h1 class="text-3xl font-bold text-white mb-1">Welcome back</h1>
            <p class="text-gray-400 text-sm">Sign in to ODtech ERP</p>
        </div>

        <!-- Card -->
        <div class="glass rounded-3xl p-8 shadow-2xl">

            <!-- Flash messages -->
            ">
                {{ msg }}
            </div>
            {% endfor %}
            {% endif %}

            <form method="post" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}" autocomplete="off">
                {% csrf_token %}

                <!-- Employee Code -->
                <div class="mb-5">
                    <label for="id_username" class="block text-sm font-medium text-gray-300 mb-2">Employee Code</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-500">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        </span>
                        <input type="text" id="id_username" name="username" placeholder="Enter your employee code"
                               class="input-field pl-11" required autofocus>
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-7">
                    <div class="flex items-center justify-between mb-2">
                        <label for="id_password" class="block text-sm font-medium text-gray-300">Password</label>
                        <a href="{% url 'password_reset' %}" class="text-xs font-semibold text-blue-400 hover:text-blue-300 transition-colors">Forgot Password?</a>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-500 pointer-events-none">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        </span>
                        <input type="password" id="id_password" name="password" placeholder="Enter your password"
                               class="input-field pl-11 pr-11" required>
                        <button type="button" id="toggle_password" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-400 hover:text-gray-200 transition-colors focus:outline-none">
                            <!-- eye icon (visible when password is shown) -->
                            <svg id="eye_open" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <!-- eye off icon (visible when password is hidden) -->
                            <svg id="eye_closed" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit"
                        class="w-full py-3 px-6 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold rounded-xl transition-all duration-200 shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 hover:-translate-y-0.5 text-base">
                    Sign In
                </button>
            </form>
        </div>

        <p class="text-center text-gray-600 text-xs mt-6">
            ODtech ERP &copy; 2026 &mdash; All rights reserved
        </p>
    </div>

    <!-- Script to toggle password field visibility -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('id_password');
            const toggleBtn = document.getElementById('toggle_password');
            const eyeOpen = document.getElementById('eye_open');
            const eyeClosed = document.getElementById('eye_closed');

            toggleBtn.addEventListener('click', function() {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    eyeOpen.classList.remove('hidden');
                    eyeClosed.classList.add('hidden');
                } else {
                    passwordInput.type = 'password';
                    eyeOpen.classList.add('hidden');
                    eyeClosed.classList.remove('hidden');
                }
            });
        });
    </script>
</body>
</html>
