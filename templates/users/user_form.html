{% extends 'base.html' %}
{% block header %}{{ form_title }}{% endblock %}
{% block content %}

<div class="max-w-2xl mx-auto">
    <!-- Back -->
    <div class="mb-6">
        <a href="{% url 'user_list' %}" class="flex items-center text-gray-400 hover:text-white transition-colors text-sm w-fit">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            Back to Users
        </a>
    </div>

    <!-- Flash -->
    {% if messages %}
    {% for msg in messages %}
    <div class="mb-4 p-3 rounded-xl text-sm font-medium flex items-center gap-2 {% if msg.tags == 'error' %}bg-red-50 border border-red-200 text-red-700{% else %}bg-emerald-50 border border-emerald-200 text-emerald-700{% endif %}">
        {{ msg }}
    </div>
    {% endfor %}
    {% endif %}

    <!-- Form Card -->
    <div class="glass rounded-2xl p-8">
        <div class="flex items-center space-x-3 mb-8">
            <div class="w-10 h-10 rounded-xl bg-indigo-600/30 flex items-center justify-center">
                <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
            </div>
            <h2 class="text-xl font-bold text-white">{{ form_title }}</h2>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">

                <!-- Employee Code (read-only on edit) -->
                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-gray-300 mb-2">Employee Code <span class="text-red-400">*</span></label>
                    {% if target_user %}
                    <input type="text" value="{{ target_user.empid }}" disabled
                           class="w-full px-4 py-3 bg-slate-800/50 border border-white/10 rounded-xl text-gray-400 text-sm cursor-not-allowed">
                    {% else %}
                    <input type="text" name="empid" required placeholder="e.g. EMP001"
                           class="w-full px-4 py-3 bg-slate-900/60 border border-white/10 rounded-xl text-white text-sm placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition">
                    {% endif %}
                </div>

                <!-- First Name -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">First Name</label>
                    <input type="text" name="username" value="{{ target_user.username|default:'' }}" placeholder="First name"
                           class="w-full px-4 py-3 bg-slate-900/60 border border-white/10 rounded-xl text-white text-sm placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition">
                </div>

                <!-- Last Name -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Last Name</label>
                    <input type="text" name="last_name" value="{{ target_user.last_name|default:'' }}" placeholder="Last name"
                           class="w-full px-4 py-3 bg-slate-900/60 border border-white/10 rounded-xl text-white text-sm placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition">
                </div>

                <!-- Email -->
                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
                    <input type="email" name="email" value="{{ target_user.email|default:'' }}" placeholder="user@example.com"
                           class="w-full px-4 py-3 bg-slate-900/60 border border-white/10 rounded-xl text-white text-sm placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition">
                </div>

                <!-- Role -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Role <span class="text-red-400">*</span></label>
                    <select name="role" required
                            class="w-full px-4 py-3 bg-slate-900/60 border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition appearance-none">
                        {% for value, label in role_choices %}
                        <option value="{{ value }}" {% if target_user.role == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Active toggle -->
                <div class="flex items-center">
                    <label class="flex items-center gap-3 cursor-pointer group mt-7">
                        <input type="checkbox" name="is_active" id="is_active"
                               {% if not target_user or target_user.is_active %}checked{% endif %}
                               class="w-5 h-5 rounded border-white/20 bg-slate-900 text-blue-500 focus:ring-blue-500/30">
                        <span class="text-sm font-medium text-gray-300 group-hover:text-white transition">Active Account</span>
                    </label>
                </div>

                <!-- Password -->
                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-gray-300 mb-2">
                        Password {% if target_user %}<span class="text-gray-500 font-normal">(leave blank to keep current)</span>{% else %}<span class="text-red-400">*</span>{% endif %}
                    </label>
                    <input type="password" name="password" {% if not target_user %}required{% endif %} placeholder="Enter password"
                           autocomplete="new-password"
                           class="w-full px-4 py-3 bg-slate-900/60 border border-white/10 rounded-xl text-white text-sm placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition">
                </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center justify-between mt-8 pt-6 border-t border-white/10">
                <a href="{% url 'user_list' %}" class="px-5 py-2.5 bg-slate-700 hover:bg-slate-600 text-gray-300 font-medium rounded-xl text-sm transition-colors">
                    Cancel
                </a>
                <button type="submit"
                        class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-sm transition-all shadow-lg shadow-indigo-500/20 hover:-translate-y-0.5">
                    {{ submit_label }}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
