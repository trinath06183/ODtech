{% load static %}
<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Profile — ODtech ERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { background: linear-gradient(135deg, #F0F9FF 0%, #E0F2FE 100%); background-attachment: fixed; }
        .glass { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(56, 189, 248, 0.18); }
        .input-field {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: #0f172a;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            width: 100%;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        .input-field:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,0.15); }
        .input-field::placeholder { color: rgba(71, 85, 105, 0.6); }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
        .blob { animation: float 6s ease-in-out infinite; }
        .blob2 { animation: float 8s ease-in-out infinite reverse; }

        /* Premium Light Theme overrides */
        .text-white { color: #0F172A !important; }
        .text-gray-300 { color: #334155 !important; }
        .text-gray-400 { color: #475569 !important; }
        .text-gray-500 { color: #475569 !important; }
        .text-gray-600 { color: #64748B !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans antialiased relative overflow-hidden py-12">

    <!-- Decorative blobs -->
    <div class="blob absolute top-[-8%] left-[-5%] w-96 h-96 bg-blue-600/15 rounded-full blur-[80px] pointer-events-none"></div>
    <div class="blob2 absolute bottom-[-8%] right-[-5%] w-96 h-96 bg-purple-600/15 rounded-full blur-[80px] pointer-events-none"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-indigo-600/5 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="w-full max-w-md px-4">
        <!-- Logo + Brand -->
        <div class="text-center mb-8">
            <a href="/">
                <img src="{% static 'img/logo.png' %}" alt="ODtech Logo" class="h-16 mx-auto mb-4 drop-shadow-lg">
            </a>
            <h1 class="text-3xl font-bold text-white mb-1">Complete Profile</h1>
            <p class="text-gray-400 text-sm">Please finalize your profile details to continue</p>
        </div>

        <!-- Card -->
        <div class="glass rounded-3xl p-8 shadow-2xl">

            <!-- Flash messages -->
            {% if messages %}
            {% for msg in messages %}
            <div class="mb-5 px-4 py-3 rounded-xl text-sm font-medium
                {% if msg.tags == 'error' %}bg-red-500/20 text-red-300 border border-red-500/30
                {% else %}bg-emerald-500/20 text-emerald-300 border border-emerald-500/30{% endif %}">
                {{ msg }}
            </div>
            {% endfor %}
            {% endif %}

            <form method="post" action="{% url 'onboarding' %}" autocomplete="off">
                {% csrf_token %}

                <!-- First Name -->
                <div class="mb-5">
                    <label for="id_first_name" class="block text-sm font-medium text-gray-300 mb-2">First Name <span class="text-red-400">*</span></label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-500 pointer-events-none">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        </span>
                        <input type="text" id="id_first_name" name="username" placeholder="Your first name"
                               class="input-field pl-11" required autofocus value="{{ request.POST.username|default:request.user.username }}">
                    </div>
                </div>

                <!-- Last Name -->
                <div class="mb-5">
                    <label for="id_last_name" class="block text-sm font-medium text-gray-300 mb-2">Last Name <span class="text-red-400">*</span></label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-500 pointer-events-none">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        </span>
                        <input type="text" id="id_last_name" name="last_name" placeholder="Your last name"
                               class="input-field pl-11" required value="{{ request.POST.last_name|default:request.user.last_name }}">
                    </div>
                </div>

                <!-- Designation -->
                <div class="mb-5">
                    <label for="id_designation" class="block text-sm font-medium text-gray-300 mb-2">Designation <span class="text-red-400">*</span></label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-500 pointer-events-none">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                        </span>
                        <input type="text" id="id_designation" name="designation" placeholder="e.g. Accountant Manager"
                               class="input-field pl-11" required value="{{ request.POST.designation|default:request.user.designation|default:'' }}">
                    </div>
                </div>

                <!-- Employee ID -->
                <div class="mb-8">
                    <label for="id_empid" class="block text-sm font-medium text-gray-300 mb-2">Employee ID <span class="text-red-400">*</span></label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-500 pointer-events-none">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
                        </span>
                        <input type="text" id="id_empid" name="empid" placeholder="e.g. EMP-1092"
                               class="input-field pl-11" required value="{{ request.POST.empid|default:request.user.empid|default:'' }}">
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit"
                        class="w-full py-3 px-6 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold rounded-xl transition-all duration-200 shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 hover:-translate-y-0.5 text-base">
                    Save Profile & Continue
                </button>

                <!-- Logout alternative link -->
                <div class="mt-6 text-center">
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="font-semibold text-red-400 hover:text-red-300 transition-colors text-sm focus:outline-none">
                            Sign out
                        </button>
                    </form>
                </div>
            </form>
        </div>

        <p class="text-center text-gray-600 text-xs mt-6">
            ODtech ERP &copy; 2026 &mdash; All rights reserved
        </p>
    </div>
</body>
</html>
