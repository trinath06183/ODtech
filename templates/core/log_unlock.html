{% extends 'base.html' %}

{% block title %}System Logs Access{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center -mt-16">
    <div class="max-w-md w-full glass rounded-3xl p-8 shadow-xl">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-red-100 text-red-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl">
                🛡
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Secure Access Required</h1>
            <p class="text-sm text-slate-500 mt-2">Please verify your identity to access system-wide activity logs. Access will be granted for 15 minutes.</p>
        </div>

        <form method="POST" action="{% url 'log_unlock' %}" class="space-y-6">
            {% csrf_token %}
            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Admin Password</label>
                <input type="password" name="password" id="password" required autofocus
                       class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-violet-500 focus:ring-2 focus:ring-violet-200 transition-all text-sm">
            </div>

            <button type="submit"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-violet-600 hover:bg-violet-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-violet-500 transition-colors">
                Unlock Logs
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="{% url 'dashboard' %}" class="text-sm text-slate-500 hover:text-slate-700">← Back to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
