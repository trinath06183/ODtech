<div class="bg-white border {% if item.status == 'Completed' %}border-slate-200 bg-slate-50{% else %}border-purple-200 shadow-sm shadow-purple-50 hover:border-purple-400{% endif %} rounded-xl p-4 transition-all group relative">
    <form method="POST">
        {% csrf_token %}
        <input type="hidden" name="action" value="edit_purchase">
        <input type="hidden" name="id" value="{{ item.id }}">
        
        <div class="flex items-center justify-between mb-3">
            <div class="flex-1 mr-4">
                <input type="text" name="title" value="{{ item.title }}" class="font-bold text-slate-800 w-full bg-transparent border-none p-0 focus:ring-0 {% if item.status == 'Completed' %}line-through text-slate-500{% endif %} hover:bg-slate-50 rounded px-1 -ml-1 transition-colors">
                <div class="flex items-center gap-2 mt-1">
                    <span class="text-[10px] uppercase font-bold text-slate-400">Planned for</span>
                    <input type="month" name="expected_month" value="{{ item.expected_month|date:'Y-m' }}" class="text-[10px] uppercase font-bold text-slate-500 bg-transparent border-slate-200 hover:bg-slate-50 rounded px-1 py-0 h-5 border-none focus:ring-0 focus:bg-white transition-colors cursor-pointer">
                </div>
            </div>
            <div class="text-right w-28">
                <div class="flex items-center justify-end gap-1">
                    <span class="text-sm font-bold text-purple-600">₹</span>
                    <input type="number" step="0.01" name="amount" value="{{ item.amount|stringformat:'.2f' }}" class="w-full text-sm font-bold text-purple-600 bg-transparent border-none p-0 text-right focus:ring-0 hover:bg-purple-50 rounded px-1 transition-colors">
                </div>
                <p class="text-xs text-slate-500 mt-1">Given: ₹{{ item.payments_given|floatformat:2 }}</p>
            </div>
        </div>
        
        <div class="flex items-center gap-3 border-t pt-3 mt-1">
            <div class="flex-1 flex items-center gap-2">
                <label class="text-xs font-semibold text-slate-600">Update Given (₹):</label>
                <input type="number" step="0.01" name="payments_given" value="{{ item.payments_given|stringformat:'.2f' }}" class="w-24 text-xs p-1 border-slate-300 rounded focus:ring-purple-500 h-7">
            </div>
            
            <div class="flex items-center gap-1.5">
                <input type="text" name="status" value="{{ item.status }}" placeholder="e.g. Pending, Completed..." class="w-28 text-xs p-1 border-slate-300 rounded focus:ring-purple-500 h-7 text-slate-600 font-semibold">
            </div>
            
            <button type="submit" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-3 py-1.5 rounded-lg transition-colors">Save</button>
        </div>
    </form>
    
    <!-- Delete Form -->
    <form method="POST" class="absolute top-3 right-4 hidden group-hover:block" onsubmit="return confirm('Are you sure you want to delete this purchase?');">
        {% csrf_token %}
        <input type="hidden" name="action" value="delete_purchase">
        <input type="hidden" name="id" value="{{ item.id }}">
        <button type="submit" class="text-slate-300 hover:text-red-500 transition-colors p-1" title="Delete Purchase">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
        </button>
    </form>
</div>
