{% extends 'edms/base_edms.html' %}

{% block edms_content %}
<div class="max-w-xl mx-auto">
    <div class="flex items-center gap-3 mb-6">
        <a href="{% url 'edms:department_list' %}" class="text-violet-600 hover:underline text-sm">← Back to Departments</a>
        <h1 class="text-xl font-bold text-slate-800">Add Department</h1>
    </div>

    <div class="glass rounded-2xl p-8">
        <form method="POST" novalidate>
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1.5">Department Name *</label>
                    {{ form.name }}
                    {% if form.name.errors %}<p class="text-red-500 text-xs mt-1">{{ form.name.errors }}</p>{% endif %}
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1.5">Department Code</label>
                    {{ form.code }}
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1.5">Description</label>
                    {{ form.description }}
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1.5">Head of Department</label>
                    {{ form.head }}
                </div>
                <div class="flex items-center gap-2 mt-4">
                    {{ form.is_active }}
                    <label class="text-sm font-medium text-slate-700">Active Department</label>
                </div>
            </div>

            <div class="flex gap-3 mt-8">
                <button type="submit" class="flex-1 py-3 bg-gradient-to-r from-violet-600 to-indigo-600 text-white font-semibold rounded-xl shadow hover:shadow-lg transition-all">
                    Add Department
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
