{% extends 'edms/base_edms.html' %}
{% load edms_tags %}

{% block edms_content %}
<div class="max-w-xl mx-auto mt-10">
    <div class="glass rounded-2xl p-8 text-center">
        <div class="text-6xl mb-4 text-red-500">🗑️</div>
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Delete Document</h1>
        <p class="text-slate-600 mb-6">
            Are you sure you want to delete <strong class="text-slate-800">"{{ document.title }}"</strong>?
            <br><span class="text-xs text-red-500">This action will soft-delete the document and log the deletion.</span>
        </p>

        <form method="POST" class="space-y-4 text-left">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Reason for deletion (optional)</label>
                <input type="text" name="reason" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white/70 focus:outline-none focus:ring-2 focus:ring-red-400 text-sm" placeholder="Why are you deleting this document?">
            </div>

            <div class="flex items-center space-x-2 mt-3">
                <input type="checkbox" name="permanent_delete" id="permanent_delete" class="w-4 h-4 text-red-600 border-gray-300 rounded focus:ring-red-500 cursor-pointer">
                <label for="permanent_delete" class="text-sm font-medium text-slate-700 cursor-pointer">
                    Permanently delete this document <span class="text-red-500 font-normal">(cannot be undone)</span>
                </label>
            </div>

            <div class="flex gap-3 pt-4">
                <button type="submit" class="flex-1 py-2.5 bg-red-600 text-white font-semibold rounded-xl hover:bg-red-700 transition-colors">
                    Yes, Delete
                </button>
                <a href="{% url 'edms:document_detail' doc_id=document.id %}" class="px-6 py-2.5 border border-slate-200 text-slate-600 font-medium rounded-xl hover:bg-slate-50 transition-colors text-center">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
