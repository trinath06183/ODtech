# ODtech ERP Production Site Configuration Template
# Place in /etc/nginx/sites-available/odtech and symlink to /etc/nginx/sites-enabled/

# Rate limiting zone (20 requests/sec per IP)
limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=20r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 50M;

    # Static assets with aggressive caching & compression
    location /static/ {
        alias /home/server_admin/ODtech/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Media uploads with 7-day browser caching
    location /media/ {
        alias /home/server_admin/ODtech/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Main application proxy
    location / {
        limit_req zone=req_limit_per_ip burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
    }
}
